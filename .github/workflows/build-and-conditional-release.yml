name: Build and conditional release

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'

  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'

  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.configuration }})
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        include:
          - configuration: Launcher
            project: Launcher/Launcher.vcxproj
            output-file: ddraw.dll

          - configuration: Release
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g2a.dll

          - configuration: Release_AVX
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g2a_avx.dll

          - configuration: Release_AVX2
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g2a_avx2.dll

          - configuration: Release_G1
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g1.dll

          - configuration: Release_G1_12f
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g1a.dll

          - configuration: Release_G1_AVX
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g1_avx.dll

          - configuration: Release_G1_AVX2
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g1_avx2.dll

          - configuration: Spacer_NET
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g2_spacer.dll

          - configuration: Spacer_NET_G1
            project: D3D11Engine/D3D11Engine.vcxproj
            output-file: g1_spacer.dll

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build configuration
        uses: ./.github/actions/build-configuration
        with:
          configuration: ${{ matrix.configuration }}
          project: ${{ matrix.project }}
          output-file: ${{ matrix.output-file }}

  # Bramka jakosci shaderow: 225 plikow w D3D11Engine/Shaders kompiluje sie dzis WYLACZNIE w graczu,
  # wiec literowka w shaderze dociera do ludzi. Zadanie kompiluje je fxc i nie pozwala na regresje;
  # lista znanych wyjatkow jest mierzona z pierwszego przebiegu (artefakt), nie zgadywana.
  shader-smoke:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile every shader
        shell: pwsh
        run: ./tools/compile-shaders.ps1

      - name: Upload the measured allowlist
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shader-allowlist
          path: tools/shader-allowlist.txt
          if-no-files-found: ignore

  package-artifacts:
    needs: build
    runs-on: ubuntu-latest

    outputs:
      artifact-id-release: ${{ steps.package-artifacts.outputs.artifact-id-release }}
      artifact-id-debug: ${{ steps.package-artifacts.outputs.artifact-id-debug }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Package artifacts
        id: package-artifacts
        uses: ./.github/actions/package-artifacts

  create-release:
    if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_type == 'tag')
    needs: package-artifacts
    runs-on: ubuntu-latest
    # MEASURED 26.11.2026: without this the job inherits the repository default token permissions
    # (read-only), so both publishing the release and generating its notes fail with
    # "Error 403: Resource not accessible by integration". Only this job needs write access.
    permissions:
      contents: write

    steps:
      - name: Checkout only composite actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          filter: blob:none

      - name: Create release
        uses: ./.github/actions/create-release
        with:
          nightly: ${{ github.ref_type != 'tag' }}
          artifact-id-release: ${{ needs.package-artifacts.outputs.artifact-id-release }}
          artifact-id-debug: ${{ needs.package-artifacts.outputs.artifact-id-debug }}
          token: ${{ secrets.GITHUB_TOKEN }}
